<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إنشاء حساب | Job Link DZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #f5f7fa;
      color: #111827;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 76px;
      padding: 0 7%;

      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Libre Baskerville", serif;
      font-size: 21px;
      font-weight: 700;
      direction: ltr;
      white-space: nowrap;
    }

    .logo span {
      color: #2563eb;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px 20px;
    }

    .register-card {
      width: 100%;
      max-width: 520px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 14px;

      padding: 38px;

      box-shadow:
        0 15px 40px rgba(15, 23, 42, 0.06);
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 28px;
      font-weight: 800;
    }

    .title h1 span {
      color: #2563eb;
    }

    .title p {
      color: #6b7280;
      font-size: 13px;
      margin-top: 8px;
    }

    .account-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;

      margin-bottom: 25px;
    }

    .account-type {
      border: 1px solid #d1d5db;
      border-radius: 10px;

      padding: 18px 12px;

      background: #ffffff;

      cursor: pointer;

      text-align: center;

      transition: 0.2s;
    }

    .account-type:hover {
      border-color: #93c5fd;
    }

    .account-type.active {
      border-color: #2563eb;

      background: #eff6ff;

      box-shadow:
        0 0 0 2px rgba(37, 99, 235, 0.08);
    }

    .account-type strong {
      display: block;

      color: #111827;

      font-size: 15px;
    }

    .account-type small {
      display: block;

      margin-top: 5px;

      color: #6b7280;

      font-size: 11px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;
      border-radius: 7px;

      outline: none;

      background: #ffffff;

      font-family: "Cairo", sans-serif;
      font-size: 14px;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    .submit-button {
      width: 100%;

      border: none;
      border-radius: 7px;

      padding: 13px;

      background: #2563eb;
      color: #ffffff;

      font-family: "Cairo", sans-serif;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .submit-button:hover {
      background: #1d4ed8;
    }

    #message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 7px;

      text-align: center;

      font-size: 12px;
      font-weight: 600;
    }

    .login {
      text-align: center;

      color: #6b7280;

      font-size: 13px;

      margin-top: 22px;
    }

    .login a {
      color: #2563eb;

      text-decoration: none;

      font-weight: 700;
    }

    footer {
      background: #080d18;

      color: white;

      text-align: center;

      padding: 25px 20px;
    }

    footer strong {
      font-family: "Libre Baskerville", serif;
      direction: ltr;
    }

    footer strong span {
      color: #60a5fa;
    }

    footer p {
      color: #9ca3af;

      font-size: 11px;

      margin-top: 7px;
    }

    @media (max-width: 600px) {

      header {
        padding: 0 5%;
      }

      .register-card {
        padding: 25px 20px;
      }

      .account-types {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    JOB <span>LINK</span> DZ
  </div>

  <a
    href="index.html"
    class="home-link"
  >
    الرئيسية
  </a>

</header>


<main>

  <div class="register-card">


    <div class="title">

      <h1>
        إنشاء <span>حساب</span>
      </h1>

      <p>
        انضم إلى Job Link DZ
      </p>

    </div>


    <div class="account-types">

      <div
        class="account-type active"
        data-type="jobseeker"
      >

        <strong>
          باحث عن عمل
        </strong>

        <small>
          أبحث عن فرصة عمل
        </small>

      </div>


      <div
        class="account-type"
        data-type="company"
      >

        <strong>
          شركة / صاحب عمل
        </strong>

        <small>
          أبحث عن موظفين
        </small>

      </div>

    </div>


    <form id="registerForm">


      <div
        class="field"
        id="nameField"
      >

        <label for="name">
          الاسم الكامل
        </label>

        <input
          type="text"
          id="name"
          placeholder="مثال: عبد المعين معمري"
          required
        >

      </div>


      <div
        class="field"
        id="companyField"
        style="display:none;"
      >

        <label for="companyName">
          اسم الشركة
        </label>

        <input
          type="text"
          id="companyName"
          placeholder="مثال: Hotel XYZ"
        >

      </div>


      <div class="field">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          كلمة المرور
        </label>

        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="••••••••"
          required
        >

      </div>


      <button
        type="submit"
        class="submit-button"
      >
        إنشاء الحساب
      </button>


    </form>


    <div id="message"></div>


    <div class="login">

      لديك حساب بالفعل؟

      <a href="login.html">
        تسجيل الدخول
      </a>

    </div>


  </div>

</main>


<footer>

  <strong>
    JOB <span>LINK</span> DZ
  </strong>

  <p>
    منصة التوظيف الجزائرية
  </p>

  <p>
    © 2026 Job Link DZ
  </p>

</footer>


<script>

  let accountType = "jobseeker";


  const accountTypes =
    document.querySelectorAll(".account-type");


  const companyField =
    document.getElementById("companyField");


  accountTypes.forEach(function(type) {

    type.addEventListener(
      "click",
      function() {

        accountTypes.forEach(function(item) {

          item.classList.remove("active");

        });


        type.classList.add("active");


        accountType =
          type.dataset.type;


        if (accountType === "company") {

          companyField.style.display =
            "block";

          document
            .getElementById("companyName")
            .required = true;

        } else {

          companyField.style.display =
            "none";

          document
            .getElementById("companyName")
            .required = false;

        }

      }
    );

  });


  const registerForm =
    document.getElementById("registerForm");


  const message =
    document.getElementById("message");


  registerForm.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const password =
        document.getElementById("password").value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      if (password !== confirmPassword) {

        message.style.display = "block";

        message.style.background = "#fef2f2";
        message.style.color = "#b91c1c";

        message.textContent =
          "كلمتا المرور غير متطابقتين.";

        return;

      }


      message.style.display = "block";

      message.style.background = "#eff6ff";
      message.style.color = "#1d4ed8";


      if (accountType === "company") {

        message.textContent =
          "تم تجهيز نموذج حساب الشركة. سيتم تفعيل الحسابات الحقيقية عند ربط قاعدة البيانات.";

      } else {

        message.textContent =
          "تم تجهيز نموذج حساب الباحث عن عمل. سيتم تفعيل الحسابات الحقيقية عند ربط قاعدة البيانات.";

      }

    }
  );

</script>


</body>

</html>
