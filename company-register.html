<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل شركة | Job Link DZ</title>

  <meta
    name="description"
    content="إنشاء حساب شركة على منصة Job Link DZ"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* ================= RESET ================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #f5f7fa;
      color: #111827;
      min-height: 100vh;
    }

    a,
    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }


    /* ================= HEADER ================= */

    header {
      min-height: 76px;
      padding: 0 7%;

      background: #ffffff;

      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: "Libre Baskerville", serif;

      font-size: 21px;
      font-weight: 700;

      color: #111827;

      direction: ltr;

      white-space: nowrap;
    }

    .logo span {
      color: #2563eb;
    }

    .home-link {
      color: #2563eb;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s;
    }

    .home-link:hover {
      color: #1d4ed8;
    }


    /* ================= MAIN ================= */

    main {
      padding: 55px 20px 70px;
    }

    .register-card {
      width: 100%;
      max-width: 760px;

      margin: auto;

      background: #ffffff;

      border: 1px solid #e5e7eb;

      border-radius: 16px;

      padding: 42px;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.07);
    }


    /* ================= TITLE ================= */

    .title {
      text-align: center;

      margin-bottom: 35px;
    }

    .title h1 {
      font-size: 30px;

      font-weight: 800;

      color: #111827;
    }

    .title h1 span {
      color: #2563eb;
    }

    .title p {
      margin-top: 8px;

      color: #6b7280;

      font-size: 14px;
    }


    /* ================= FORM SECTIONS ================= */

    .section-title {
      margin: 30px 0 18px;

      padding-bottom: 10px;

      border-bottom: 1px solid #e5e7eb;

      color: #111827;

      font-size: 17px;

      font-weight: 800;
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .form-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 18px;
    }

    .field {
      margin-bottom: 3px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #374151;

      font-size: 13px;

      font-weight: 700;
    }


    /* ================= INPUTS ================= */

    input,
    select,
    textarea {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      outline: none;

      background: #ffffff;

      color: #111827;

      font-size: 14px;

      transition: 0.2s;
    }

    textarea {
      min-height: 110px;

      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    input::placeholder,
    textarea::placeholder {
      color: #9ca3af;
    }


    /* ================= HINT ================= */

    .hint {
      margin-top: 6px;

      color: #9ca3af;

      font-size: 11px;
    }


    /* ================= TERMS ================= */

    .terms {
      margin-top: 25px;

      padding: 15px;

      background: #f8fafc;

      border: 1px solid #e5e7eb;

      border-radius: 8px;

      display: flex;

      gap: 10px;

      align-items: flex-start;
    }

    .terms input {
      width: auto;

      margin-top: 5px;

      accent-color: #2563eb;
    }

    .terms label {
      margin: 0;

      color: #6b7280;

      font-size: 12px;

      font-weight: 500;

      cursor: pointer;
    }


    /* ================= BUTTON ================= */

    .submit-button {
      width: 100%;

      margin-top: 25px;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #2563eb;

      color: #ffffff;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;
    }

    .submit-button:hover {
      background: #1d4ed8;
    }

    .submit-button:disabled {
      opacity: 0.7;

      cursor: not-allowed;
    }


    /* ================= MESSAGE ================= */

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px;

      border-radius: 8px;

      text-align: center;

      font-size: 13px;

      font-weight: 700;
    }


    /* ================= LOGIN ================= */

    .login-company {
      text-align: center;

      margin-top: 25px;

      color: #6b7280;

      font-size: 13px;
    }

    .login-company a {
      color: #2563eb;

      text-decoration: none;

      font-weight: 800;
    }

    .login-company a:hover {
      text-decoration: underline;
    }


    /* ================= FOOTER ================= */

    footer {
      background: #080d18;

      color: #ffffff;

      text-align: center;

      padding: 28px 20px;
    }

    footer strong {
      font-family: "Libre Baskerville", serif;

      direction: ltr;

      font-size: 18px;
    }

    footer strong span {
      color: #60a5fa;
    }

    footer p {
      margin-top: 7px;

      color: #9ca3af;

      font-size: 11px;
    }

    .footer-founder {
      color: #60a5fa !important;
    }


    /* ================= MOBILE ================= */

    @media (max-width: 650px) {

      header {
        padding: 0 5%;
      }

      .register-card {
        padding: 28px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .title h1 {
        font-size: 25px;
      }

      .title p {
        font-size: 13px;
      }

      main {
        padding: 30px 12px 50px;
      }

    }

  </style>

</head>


<body>


  <!-- ================= HEADER ================= -->

  <header>

    <div class="logo">
      JOB <span>LINK</span> DZ
    </div>

    <a
      href="index.html"
      class="home-link"
    >
      الرئيسية
    </a>

  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <div class="register-card">


      <!-- ================= TITLE ================= -->

      <div class="title">

        <h1>
          إنشاء حساب <span>شركة</span>
        </h1>

        <p>
          انضم إلى Job Link DZ وابحث عن أفضل المواهب الجزائرية
        </p>

      </div>


      <!-- ================= FORM ================= -->

      <form id="companyForm">


        <!-- ================= COMPANY INFORMATION ================= -->

        <div class="section-title">
          معلومات الشركة
        </div>


        <div class="form-grid">


          <!-- COMPANY NAME -->

          <div class="field">

            <label for="companyName">
              اسم الشركة
            </label>

            <input
              type="text"
              id="companyName"
              placeholder="مثال: Hotel Royal"
              autocomplete="organization"
              required
            >

          </div>


          <!-- SECTOR -->

          <div class="field">

            <label for="sector">
              القطاع
            </label>

            <select
              id="sector"
              required
            >

              <option value="">
                اختر القطاع
              </option>

              <option value="الفنادق">
                الفنادق
              </option>

              <option value="المطاعم">
                المطاعم
              </option>

              <option value="التكنولوجيا">
                التكنولوجيا
              </option>

              <option value="التجارة">
                التجارة
              </option>

              <option value="الصناعة">
                الصناعة
              </option>

              <option value="البناء">
                البناء
              </option>

              <option value="النقل">
                النقل
              </option>

              <option value="الصحة">
                الصحة
              </option>

              <option value="قطاعات أخرى">
                قطاعات أخرى
              </option>

            </select>

          </div>


          <!-- CITY -->

          <div class="field">

            <label for="city">
              الولاية
            </label>

            <select
              id="city"
              required
            >

              <option value="">
                اختر الولاية
              </option>

              <option>الجزائر</option>
              <option>وهران</option>
              <option>سطيف</option>
              <option>قسنطينة</option>
              <option>عنابة</option>
              <option>باتنة</option>
              <option>بجاية</option>
              <option>بسكرة</option>
              <option>البليدة</option>
              <option>تيزي وزو</option>
              <option>تلمسان</option>
              <option>برج بوعريريج</option>
              <option>بومرداس</option>
              <option>مستغانم</option>
              <option>ورقلة</option>
              <option>غرداية</option>

            </select>

          </div>


          <!-- WEBSITE -->

          <div class="field">

            <label for="website">
              الموقع الإلكتروني
            </label>

            <input
              type="url"
              id="website"
              placeholder="https://example.com"
              autocomplete="url"
            >

          </div>


          <!-- DESCRIPTION -->

          <div class="field full">

            <label for="description">
              نبذة عن الشركة
            </label>

            <textarea
              id="description"
              placeholder="اكتب نبذة قصيرة عن الشركة ونشاطها..."
            ></textarea>

          </div>

        </div>


        <!-- ================= ACCOUNT INFORMATION ================= -->

        <div class="section-title">
          معلومات مسؤول الحساب
        </div>


        <div class="form-grid">


          <!-- FULL NAME -->

          <div class="field">

            <label for="fullName">
              اسم المسؤول
            </label>

            <input
              type="text"
              id="fullName"
              placeholder="الاسم الكامل"
              autocomplete="name"
              required
            >

          </div>


          <!-- POSITION -->

          <div class="field">

            <label for="position">
              المنصب
            </label>

            <input
              type="text"
              id="position"
              placeholder="HR Manager"
              required
            >

          </div>


          <!-- EMAIL -->

          <div class="field">

            <label for="email">
              البريد الإلكتروني المهني
            </label>

            <input
              type="email"
              id="email"
              placeholder="hr@company.com"
              autocomplete="email"
              required
            >

          </div>


          <!-- PHONE -->

          <div class="field">

            <label for="phone">
              رقم الهاتف
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="05 XX XX XX XX"
              autocomplete="tel"
              required
            >

          </div>


          <!-- PASSWORD -->

          <div class="field">

            <label for="password">
              كلمة المرور
            </label>

            <input
              type="password"
              id="password"
              placeholder="••••••••"
              minlength="6"
              autocomplete="new-password"
              required
            >

            <div class="hint">
              يجب أن تحتوي كلمة المرور على 6 أحرف أو أرقام على الأقل.
            </div>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="field">

            <label for="confirmPassword">
              تأكيد كلمة المرور
            </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="••••••••"
              minlength="6"
              autocomplete="new-password"
              required
            >

          </div>

        </div>


        <!-- ================= TERMS ================= -->

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">

            أوافق على شروط استخدام Job Link DZ
            وأؤكد أن المعلومات المقدمة تخص شركة حقيقية.

          </label>

        </div>


        <!-- ================= SUBMIT ================= -->

        <button
          type="submit"
          class="submit-button"
          id="submitButton"
        >
          إنشاء حساب الشركة
        </button>


        <!-- ================= MESSAGE ================= -->

        <div
          id="message"
          class="message"
        ></div>


      </form>


      <!-- ================= LOGIN ================= -->

      <div class="login-company">

        لديك حساب شركة بالفعل؟

        <a href="login.html">
          تسجيل الدخول
        </a>

      </div>


    </div>

  </main>


  <!-- ================= FOOTER ================= -->

  <footer>

    <strong>
      JOB <span>LINK</span> DZ
    </strong>

    <p>
      منصة التوظيف الجزائرية
    </p>

    <p class="footer-founder">
      By ABDELMOUAINMAAMRI
    </p>

    <p>
      © 2026 Job Link DZ
    </p>

  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    const companyForm =
      document.getElementById("companyForm");

    const message =
      document.getElementById("message");

    const submitButton =
      document.getElementById("submitButton");


    companyForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        /* ================= GET DATA ================= */

        const companyName =
          document
            .getElementById("companyName")
            .value
            .trim();

        const sector =
          document
            .getElementById("sector")
            .value;

        const city =
          document
            .getElementById("city")
            .value;

        const website =
          document
            .getElementById("website")
            .value
            .trim();

        const description =
          document
            .getElementById("description")
            .value
            .trim();

        const fullName =
          document
            .getElementById("fullName")
            .value
            .trim();

        const position =
          document
            .getElementById("position")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const phone =
          document
            .getElementById("phone")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;


        /* ================= PASSWORD CHECK ================= */

        if (password !== confirmPassword) {

          message.style.display = "block";

          message.style.background = "#fef2f2";

          message.style.color = "#b91c1c";

          message.textContent =
            "كلمتا المرور غير متطابقتين.";

          return;
        }


        /* ================= PASSWORD LENGTH ================= */

        if (password.length < 6) {

          message.style.display = "block";

          message.style.background = "#fef2f2";

          message.style.color = "#b91c1c";

          message.textContent =
            "كلمة المرور يجب أن تحتوي على 6 أحرف أو أرقام على الأقل.";

          return;
        }


        /* ================= COMPANY DATA ================= */

        const companyData = {

          companyName: companyName,

          sector: sector,

          city: city,

          website: website,

          description: description,

          fullName: fullName,

          position: position,

          email: email,

          phone: phone,

          createdAt:
            new Date().toISOString()

        };


        /* ================= SAVE DATA ================= */

        try {

          localStorage.setItem(
            "jobLinkCompany",
            JSON.stringify(companyData)
          );

          localStorage.setItem(
            "jobLinkCompanyLoggedIn",
            "true"
          );

        } catch (error) {

          message.style.display = "block";

          message.style.background = "#fef2f2";

          message.style.color = "#b91c1c";

          message.textContent =
            "حدث خطأ أثناء حفظ بيانات الشركة. حاول مرة أخرى.";

          return;

        }


        /* ================= SUCCESS ================= */

        submitButton.disabled = true;

        submitButton.textContent =
          "تم إنشاء الحساب...";


        message.style.display = "block";

        message.style.background = "#eff6ff";

        message.style.color = "#1d4ed8";

        message.textContent =
          "تم إنشاء حساب الشركة بنجاح. جارٍ الانتقال إلى لوحة التحكم...";


        /* ================= REDIRECT ================= */

        setTimeout(function() {

          window.location.href =
            "company-dashboard.html";

        }, 1200);

      }

    );

  </script>


</body>

</html>
