<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل شركة | Job Link DZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Cairo", sans-serif;
      background: #f5f7fa;
      color: #111827;
      min-height: 100vh;
    }
    header {
      min-height: 76px;
      padding: 0 7%;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: "Libre Baskerville", serif;
      font-size: 21px;
      font-weight: 700;
      direction: ltr;
      white-space: nowrap;
    }
    .logo span {
      color: #2563eb;
    }
    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    main {
      padding: 55px 20px 70px;
    }
    .register-card {
      width: 100%;
      max-width: 760px;
      margin: auto;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 42px;
      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.07);
    }
    .title {
      text-align: center;
      margin-bottom: 35px;
    }
    .title h1 {
      font-size: 30px;
      font-weight: 800;
      color: #111827;
    }
    .title h1 span {
      color: #2563eb;
    }
    .title p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 14px;
    }
    .section-title {
      margin: 30px 0 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e7eb;
      color: #111827;
      font-size: 17px;
      font-weight: 800;
    }
    .section-title:first-of-type {
      margin-top: 0;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .field {
      margin-bottom: 3px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 13px;
      font-weight: 700;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      background: #ffffff;
      color: #111827;
      font-family: "Cairo", sans-serif;
      font-size: 14px;
      transition: 0.2s;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.08);
    }
    .hint {
      margin-top: 6px;
      color: #9ca3af;
      font-size: 11px;
    }
    .terms {
      margin-top: 25px;
      padding: 15px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .terms input {
      width: auto;
      margin-top: 5px;
    }
    .terms label {
      margin: 0;
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
    }
    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-family: "Cairo", sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }
    .submit-button:hover {
      background: #1d4ed8;
    }
    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }
    .login-company {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
      font-size: 13px;
    }
    .login-company a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 800;
    }
    footer {
      background: #080d18;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px;
    }
    footer strong {
      font-family: "Libre Baskerville", serif;
      direction: ltr;
    }
    footer strong span {
      color: #60a5fa;
    }
    footer p {
      margin-top: 7px;
      color: #9ca3af;
      font-size: 11px;
    }
    @media (max-width: 650px) {
      header {
        padding: 0 5%;
      }
      .register-card {
        padding: 28px 20px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .field.full {
        grid-column: auto;
      }
      .title h1 {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    JOB <span>LINK</span> DZ
  </div>
  <a
    href="index.html"
    class="home-link"
  >
    الرئيسية
  </a>
</header>
<main>
  <div class="register-card">
    <div class="title">
      <h1>
        إنشاء حساب <span>شركة</span>
      </h1>
      <p>
        انضم إلى Job Link DZ وابحث عن أفضل المواهب الجزائرية
      </p>
    </div>
    <form id="companyForm">
      <div class="section-title">
        معلومات الشركة
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="companyName">
            اسم الشركة
          </label>
          <input
            type="text"
            id="companyName"
            placeholder="مثال: Hotel Royal"
            required
          >
        </div>
        <div class="field">
          <label for="sector">
            القطاع
          </label>
          <select id="sector" required>
            <option value="">
              اختر القطاع
            </option>
            <option>
              الفنادق
            </option>
            <option>
              المطاعم
            </option>
            <option>
              التكنولوجيا
            </option>
            <option>
              التجارة
            </option>
            <option>
              الصناعة
            </option>
            <option>
              البناء
            </option>
            <option>
              النقل
            </option>
            <option>
              الصحة
            </option>
            <option>
              قطاعات أخرى
            </option>
          </select>
        </div>
        <div class="field">
          <label for="city">
            الولاية
          </label>
          <select id="city" required>
            <option value="">
              اختر الولاية
            </option>
            <option>الجزائر</option>
            <option>وهران</option>
            <option>سطيف</option>
            <option>قسنطينة</option>
            <option>عنابة</option>
            <option>باتنة</option>
            <option>بجاية</option>
            <option>بسكرة</option>
            <option>البليدة</option>
            <option>تيزي وزو</option>
            <option>تلمسان</option>
            <option>برج بوعريريج</option>
            <option>بومرداس</option>
            <option>مستغانم</option>
            <option>ورقلة</option>
            <option>غرداية</option>
          </select>
        </div>
        <div class="field">
          <label for="website">
            الموقع الإلكتروني
          </label>
          <input
            type="url"
            id="website"
            placeholder="https://example.com"
          >
        </div>
        <div class="field full">
          <label for="description">
            نبذة عن الشركة
          </label>
          <textarea
            id="description"
            placeholder="اكتب نبذة قصيرة عن الشركة ونشاطها..."
          ></textarea>
        </div>
      </div>
      <div class="section-title">
        معلومات مسؤول الحساب
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="fullName">
            اسم المسؤول
          </label>
          <input
            type="text"
            id="fullName"
            placeholder="الاسم الكامل"
            required
          >
        </div>
        <div class="field">
          <label for="position">
            المنصب
          </label>
          <input
            type="text"
            id="position"
            placeholder="HR Manager"
            required
          >
        </div>
        <div class="field">
          <label for="email">
            البريد الإلكتروني المهني
          </label>
          <input
            type="email"
            id="email"
            placeholder="hr@company.com"
            required
          >
        </div>
        <div class="field">
          <label for="phone">
            رقم الهاتف
          </label>
          <input
            type="tel"
            id="phone"
            placeholder="05 XX XX XX XX"
            required
          >
        </div>
        <div class="field">
          <label for="password">
            كلمة المرور
          </label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            minlength="6"
            required
          >
        </div>
        <div class="field">
          <label for="confirmPassword">
            تأكيد كلمة المرور
          </label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            minlength="6"
            required
          >
        </div>
      </div>
      <div class="terms">
        <input
          type="checkbox"
          id="terms"
          required
        >
        <label for="terms">
          أوافق على شروط استخدام Job Link DZ
          وأؤكد أن المعلومات المقدمة تخص شركة حقيقية.
        </label>
      </div>
      <button
        type="submit"
        class="submit-button"
      >
        إنشاء حساب الشركة
      </button>
      <div
        id="message"
        class="message"
      ></div>
    </form>
    <div class="login-company">
      لديك حساب شركة بالفعل؟
      <a href="login.html">
        تسجيل الدخول
      </a>
    </div>
  </div>
</main>
<footer>
  <strong>
    JOB <span>LINK</span> DZ
  </strong>
  <p>
    منصة التوظيف الجزائرية
  </p>
  <p>
    By ABDELMOUAINMAAMRI
  </p>
  <p>
    © 2026 Job Link DZ
  </p>
</footer>
<script>
  const companyForm =
    document.getElementById("companyForm");
  const message =
    document.getElementById("message");
  companyForm.addEventListener(
    "submit",
    function(event) {
      event.preventDefault();
      const password =
        document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;
      if (password !== confirmPassword) {
        message.style.display = "block";
        message.style.background = "#fef2f2";
        message.style.color = "#b91c1c";
        message.textContent =
          "كلمتا المرور غير متطابقتين.";
        return;
      }
      message.style.display = "block";
      message.style.background = "#eff6ff";
      message.style.color = "#1d4ed8";
      message.textContent =
        "تم استلام طلب تسجيل الشركة بنجاح. نظام الحسابات الحقيقي سيتم تفعيله عند ربط قاعدة البيانات.";
    }
  );
</script>
</body>
</html>
