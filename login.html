<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | Job Link DZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #2563eb;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 23px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .welcome p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0 15px;
      font-family: "Cairo", sans-serif;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
      background: #ffffff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-left: 45px;
    }

    .show-password {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-family: "Cairo", sans-serif;
      font-size: 12px;
    }

    .forgot {
      display: block;
      text-align: left;
      color: #2563eb;
      font-size: 13px;
      text-decoration: none;
      margin-top: 8px;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-family: "Cairo", sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .register {
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    .register a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .founder-message {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }

    .founder-message .title {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .founder-message .name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .founder-message .quote {
      font-size: 15px;
      color: #2563eb;
      font-weight: 600;
      line-height: 1.8;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .login-card {
        padding: 32px 22px;
      }

      .logo h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-card">

      <div class="logo">
        <h1>Job <span>Link</span> DZ</h1>
      </div>

      <div class="welcome">
        <h2>مرحبًا بك</h2>
        <p>
          سجّل الدخول إلى حسابك للوصول إلى خدمات<br>
          Job Link DZ وإدارة ملفك المهني.
        </p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="أدخل بريدك الإلكتروني"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="أدخل كلمة المرور"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
            >
              إظهار
            </button>
          </div>

          <a href="#" class="forgot">
            نسيت كلمة المرور؟
          </a>
        </div>

        <button type="submit" class="login-button">
          تسجيل الدخول
        </button>

      </form>

      <div class="divider">
        أو
      </div>

      <div class="register">
        ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </div>

      <div class="founder-message">

        <div class="title">
          رسالة من المؤسس
        </div>

        <div class="name">
          عبد المعيـن معمري
        </div>

        <div class="quote">
          «طموحك المهني يبدأ بخطوة.»
        </div>

      </div>

    </div>

    <div class="footer">
      © 2026 Job Link DZ — جميع الحقوق محفوظة
    </div>

  </div>

  <script>

    function togglePassword() {
      const password = document.getElementById("password");
      const button = document.querySelector(".show-password");

      if (password.type === "password") {
        password.type = "text";
        button.textContent = "إخفاء";
      } else {
        password.type = "password";
        button.textContent = "إظهار";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert("واجهة تسجيل الدخول جاهزة. سنربطها بقاعدة البيانات في المرحلة القادمة.");
    });

  </script>

</body>
</html>
