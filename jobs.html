<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الوظائف | Job Link DZ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #ffffff;
      min-height: 76px;
      padding: 0 7%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-family: "Libre Baskerville", serif;
      font-weight: 700;
      font-size: 22px;
      direction: ltr;
      white-space: nowrap;
    }

    .logo span {
      color: #2563eb;
    }

    nav {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    nav a:hover {
      color: #2563eb;
    }

    .page-title {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .page-title h1 {
      font-family: "Libre Baskerville", serif;
      font-size: 38px;
      margin-bottom: 12px;
    }

    .page-title p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 45px 20px;
    }

    .filters {
      background: white;
      padding: 20px;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      gap: 12px;
      margin-bottom: 35px;
    }

    .filters input,
    .filters select {
      width: 100%;

      padding: 14px;

      border: 1px solid #d1d5db;
      border-radius: 7px;

      outline: none;

      font-family: "Cairo", sans-serif;
      background: white;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #2563eb;
    }

    .jobs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .job-card {
      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 23px;

      transition: 0.2s;
    }

    .job-card:hover {
      transform: translateY(-4px);

      border-color: #93c5fd;

      box-shadow:
        0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .sector {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .job-card h2 {
      font-size: 19px;
      color: #111827;
      margin-bottom: 12px;
    }

    .company {
      color: #4b5563;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .info {
      color: #6b7280;
      font-size: 13px;
      line-height: 2;
    }

    .tags {
      margin-top: 14px;
    }

    .tag {
      display: inline-block;

      background: #eff6ff;
      color: #2563eb;

      padding: 4px 9px;

      border-radius: 20px;

      font-size: 11px;

      margin-left: 4px;
    }

    .apply {
      display: block;

      margin-top: 18px;

      background: #111827;
      color: white;

      text-align: center;
      text-decoration: none;

      padding: 11px;

      border-radius: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    .apply:hover {
      background: #2563eb;
    }

    .empty {
      display: none;

      background: white;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 40px;

      text-align: center;

      color: #6b7280;

      grid-column: 1 / -1;
    }

    footer {
      margin-top: 40px;

      background: #080d18;
      color: white;

      text-align: center;

      padding: 30px 20px;
    }

    footer strong {
      font-family: "Libre Baskerville", serif;
    }

    footer strong span {
      color: #60a5fa;
    }

    footer p {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 7px;
    }

    @media (max-width: 850px) {

      header {
        padding: 18px 5%;

        flex-direction: column;

        gap: 15px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .jobs {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 30px;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="logo">
    JOB <span>LINK</span> DZ
  </div>

  <nav>

    <a href="index.html">
      الرئيسية
    </a>

    <a href="jobs.html">
      الوظائف
    </a>

    <a href="post-job.html">

</header>


<section class="page-title">

<main class="container">


  <div class="filters">

    <select id="citySelect">

      <option value="">

      <option>باتنة</option>
      <option>بجاية</option>
      <option>بسكرة</option>
      <option>بشار</option>
      <option>البليدة</option>
      <option>البويرة</option>
      <option>تمنراست</option>
      <option>تبسة</option>
      <option>تلمسان</option>
      <option>تيارت</option>
      <option>تيزي وزو</option>
      <option>الجزائر</option>
      <option>الجلفة</option>
      <option>جيجل</option>
      <option>سطيف</option>
      <option>سعيدة</option>
      <option>سكيكدة</option>
      <option>سيدي بلعباس</option>
      <option>عنابة</option>
      <option>قالمة</option>
      <option>قسنطينة</option>
      <option>المدية</option>
      <option>مستغانم</option>
      <option>المسيلة</option>
      <option>معسكر</option>
      <option>ورقلة</option>
      <option>وهران</option>
      <option>البيض</option>
      <option>إليزي</option>
      <option>برج بوعريريج</option>
      <option>بومرداس</option>
      <option>الطارف</option>
      <option>تندوف</option>
      <option>تيسمسيلت</option>
      <option>الوادي</option>
      <option>خنشلة</option>
      <option>سوق أهراس</option>
      <option>تيبازة</option>
      <option>ميلة</option>
      <option>عين الدفلى</option>
      <option>النعامة</option>
      <option>عين تموشنت</option>
      <option>غرداية</option>
      <option>غليزان</option>
      <option>تيميمون</option>
      <option>برج باجي مختار</option>
      <option>أولاد جلال</option>

    <select id="sectorSelect">

      <option value="">

    </select>

  </div>


  <div class="jobs" id="jobsContainer">


    <!-- JOBS ARE GENERATED BY JAVASCRIPT -->


    <div class="empty" id="emptyMessage">

      لا توجد وظائف مطابقة للبحث الحالي.

    </div>


  </div>


</main>


<footer>

  <strong>
    JOB <span>LINK</span> DZ
  </strong>

  <p>
    منصة التوظيف الجزائرية
  </p>

  <p>
    © 2026 Job Link DZ
  </p>

</footer>


<script>

  const searchInput =
    document.getElementById("searchInput");

  const citySelect =
    document.getElementById("citySelect");

  const sectorSelect =
    document.getElementById("sectorSelect");

  const contractSelect =
    document.getElementById("contractSelect");

  const jobsContainer =
    document.getElementById("jobsContainer");

  const emptyMessage =
    document.getElementById("emptyMessage");


  /*
    الوظائف التجريبية
  */

  const demoJobs = [

    {
      id: "demo1",
      company: "Hôtel Sétif",
      sector: "Hôtellerie & Restauration",
      title: "Chef de Rang",
      city: "سطيف",
      contract: "CDI",
      experience: "1 - 3 سنوات",
      salary: "حسب الخبرة"
    },

    {
      id: "demo2",
      company: "Hôtel Alger",
      sector: "الفنادق",
      title: "Réceptionniste",
      city: "الجزائر",
      contract: "CDD",
      experience: "بدون خبرة",
      salary: "حسب الخبرة"
    },

    {
      id: "demo3",
      company: "Restaurant Oran",
      sector: "المطاعم",
      title: "Chef de Cuisine",
      city: "وهران",
      contract: "CDI",
      experience: "3 - 5 سنوات",
      salary: "حسب الخبرة"
    },

    {
      id: "demo4",
      company: "Restaurant Constantine",
      sector: "المطاعم",
      title: "Serveur",
      city: "قسنطينة",
      contract: "CDD",
      experience: "بدون خبرة",
      salary: "حسب الخبرة"
    }

  ];


  /*
    قراءة الوظائف المنشورة
  */

  const savedJobs =
    JSON.parse(
      localStorage.getItem("jobLinkJobs")
    ) || [];


  /*
    الوظائف الجديدة أولاً
  */

  const allJobs = [
    ...savedJobs,
    ...demoJobs
  ];


  /*
    إنشاء بطاقة الوظيفة
  */

  function createJobCard(job) {

    const card =
      document.createElement("div");

    card.className = "job-card";


    card.dataset.city =
      job.city || "";

    card.dataset.sector =
      job.sector || "";

    card.dataset.contract =
      job.contract || "";


    card.innerHTML = `

      <div class="sector">
        ${job.sector || "قطاع غير محدد"}
      </div>

      <h2>
        ${job.title || "وظيفة"}
      </h2>

      <div class="company">
        ${job.company || "شركة"}
      </div>

      <div class="info">

        ${job.city || "الجزائر"}<br>

        ${job.contract || "غير محدد"}<br>

        الخبرة:
        ${job.experience || "غير محددة"}

      </div>

      <div class="tags">

        <span class="tag">
          ${job.contract || "وظيفة"}
        </span>

        ${
          job.salary
          ?
          `<span class="tag">${job.salary}</span>`
          :
          ""
        }

      </div>

      <a
        href="#"
        class="apply"
        data-id="${job.id}"
      >
        عرض الوظيفة
      </a>

    `;


    return card;

  }


  /*
    عرض الوظائف
  */

  function renderJobs() {

    const oldCards =
      jobsContainer.querySelectorAll(".job-card");

    oldCards.forEach(function(card) {

      card.remove();

    });


    const search =
      searchInput.value
        .toLowerCase()
        .trim();


    const city =
      citySelect.value;


    const sector =
      sectorSelect.value;


    const contract =
      contractSelect.value;


    let visibleJobs = 0;


    allJobs.forEach(function(job) {


      const searchableText = (

        (job.title || "") +
        " " +
        (job.company || "") +
        " " +
        (job.sector || "") +
        " " +
        (job.city || "")

      ).toLowerCase();


      const matchesSearch =
        search === "" ||
        searchableText.includes(search);


      const matchesCity =
        city === "" ||
        job.city === city;


      const matchesSector =
        sector === "" ||
        job.sector === sector;


      const matchesContract =
        contract === "" ||
        job.contract === contract;


      if (

        matchesSearch &&
        matchesCity &&
        matchesSector &&
        matchesContract

      ) {

        const card =
          createJobCard(job);

        jobsContainer.insertBefore(
          card,
          emptyMessage
        );

        visibleJobs++;

      }

    });


    if (visibleJobs === 0) {

      emptyMessage.style.display =
        "block";

    } else {

      emptyMessage.style.display =
        "none";

    }

  }


  /*
    الفلاتر
  */

  searchInput.addEventListener(
    "input",
    renderJobs
  );


  citySelect.addEventListener(
    "change",
    renderJobs
  );


  sectorSelect.addEventListener(
    "change",
    renderJobs
  );


  contractSelect.addEventListener(
    "change",
    renderJobs
  );


  /*
    البداية
  */

  renderJobs();


  /*
    زر عرض الوظيفة
  */

  jobsContainer.addEventListener(
    "click",
    function(event) {

      const link =
        event.target.closest(".apply");


      if (!link) {
        return;
      }


      event.preventDefault();


      const id =
        String(link.dataset.id);


      const job =
        allJobs.find(function(item) {

          return String(item.id) === id;

        });


      if (!job) {
        return;
      }


      localStorage.setItem(
        "selectedJob",
        JSON.stringify(job)
      );


      alert(
        "تم اختيار الوظيفة. سنبني صفحة تفاصيل الوظيفة في الخطوة القادمة."
      );

    }
  );

</script>

</body>

</html>
